[project]
name = "ngen-weave"
version = "0.1.1"
description = "Durable human-in-the-loop AI workflows on LangGraph"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ngen-weave-cli",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-html>=4.2.0",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ngen-weave-core = { workspace = true }
ngen-weave-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
addopts = "-m 'not live'"
asyncio_mode = "auto"
pythonpath = ["packages/ngen-weave-core"]
markers = [
    "live: touches real provider SDK internals; excluded by default, run with -m live",
]
