[project]
name = "ngen-weave-server"
version = "0.1.3"
description = "HTTP server for ngen-weave: durable human-in-the-loop AI workflows"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ngen-weave-core",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngen_weave_server"]
