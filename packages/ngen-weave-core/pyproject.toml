[project]
name = "ngen-weave-core"
version = "0.1.3"
description = "Core library for ngen-weave: durable human-in-the-loop AI workflows"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.21",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "litellm>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngen_weave"]
