[project]
name = "ngen-weave-cli"
version = "0.1.3"
description = "CLI for ngen-weave: durable human-in-the-loop AI workflows"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ngen-weave-core",
    "typer>=0.12",
]

[project.scripts]
ngen-weave = "ngen_weave_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngen_weave_cli"]
