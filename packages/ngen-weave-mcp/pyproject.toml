[project]
name = "ngen-weave-mcp"
version = "0.1.3"
description = "MCP server for ngen-weave: durable human-in-the-loop AI workflows"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ngen-weave-core",
    "mcp>=1.0",
    "starlette>=0.27",
    "uvicorn>=0.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ngen-weave-mcp = "ngen_weave_mcp.stdio:main"
ngen-weave-mcp-http = "ngen_weave_mcp.http:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ngen_weave_mcp"]
