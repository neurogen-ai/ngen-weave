[project]
name = "ngen-weave-example-swe-tools"
version = "0.1.0"
description = "SWE_tools example workflow plugin for ngen-weave"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ngen-weave-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugins"]

# Deliberately NO [project.entry-points."ngen-weave.workflows"]:
# discovery here is manifest-driven (ngen-weave.json). Install this package
# with `uv pip install -e examples/SWE_tools` (or PYTHONPATH=src) so that
# `plugins.swe_tools` is importable; the manifest's module list does the
# registration. Listing the same module through BOTH an entry point and the
# manifest raises a duplicate-registration ConfigError — pick one channel.
