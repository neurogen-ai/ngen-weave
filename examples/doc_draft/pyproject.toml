[project]
name = "ngen-weave-example-doc-draft"
version = "0.1.0"
description = "Document-drafting example workflow for ngen-weave"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ngen-weave-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_draft"]

[project.entry-points."ngen-weave.workflows"]
doc_draft = "doc_draft.workflows"
