name: CI

on: [push]

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check (deps, lint, test, build)
        run: scripts/main.sh
